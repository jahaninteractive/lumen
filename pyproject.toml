[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumen-raw"
version = "0.1.0"
description = "Fully local, non-destructive RAW photography manager for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Pillow>=11,<13"]

[project.scripts]
lumen = "lumen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]

