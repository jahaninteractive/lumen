name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: brew install exiftool
      - run: uv sync
      - run: uv run python -W error -m unittest discover -s tests -v
      - run: node --check src/lumen/static/app.js
